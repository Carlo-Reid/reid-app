<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="2026-10-14.222212">
<title>Customers – Reid Heating &amp; Cooling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F6F8;
    --panel: #FFFFFF;
    --ink: #1C2630;
    --steel: #5B6B78;
    --line: #D5DDE3;
    --blue: #1F5FA8;
    --blue-wash: #E3EDF8;
    --amber: #B86E00;
    --amber-wash: #FBF0DD;
    --red: #B3261E;
    --red-wash: #FBE5E3;
    --green: #2E7D4F;
    --green-wash: #E2F2E8;
    --on-accent: #FFFFFF;
    --radius-s: 4px;
    --radius-m: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #12181E; --panel: #1A222A; --ink: #E6ECF1; --steel: #93A3B1; --line: #2E3A45;
      --blue: #6EA8E8; --blue-wash: #1D3047; --amber: #E8A23B; --amber-wash: #3A2B12;
      --red: #F08A80; --red-wash: #3D1C1A; --green: #6CC593; --green-wash: #183224; --on-accent: #0E1620;
    }
  }
  /* colour themes chosen in Settings (Classic = the default above, follows the computer's light/dark mode) */
  :root[data-theme="night"] {
    --paper: #0F1419; --panel: #182028; --ink: #E8EDF2; --steel: #9AA8B5; --line: #2B3640;
    --blue: #7DB3F0; --blue-wash: #1B2D42; --amber: #F0AE4E; --amber-wash: #3A2B12;
    --red: #F49488; --red-wash: #3D1C1A; --green: #74CC9A; --green-wash: #183224; --on-accent: #0E1620;
  }
  :root[data-theme="warm"] {
    --paper: #F6F1E9; --panel: #FFFCF7; --ink: #2E241C; --steel: #7A6A5A; --line: #E2D7C8;
    --blue: #A4472A; --blue-wash: #F6E3DA; --amber: #9A6400; --amber-wash: #FAEED8;
    --red: #A3261E; --red-wash: #F9E2DE; --green: #4E7A2E; --green-wash: #E6F0DA; --on-accent: #FFFFFF;
  }
  :root[data-theme="forest"] {
    --paper: #EEF3EF; --panel: #FFFFFF; --ink: #17261D; --steel: #56685C; --line: #CFDDD3;
    --blue: #1F6B47; --blue-wash: #DDEFE4; --amber: #A86A00; --amber-wash: #FAF0DA;
    --red: #B0322A; --red-wash: #FAE3E0; --green: #1F6B47; --green-wash: #DDEFE4; --on-accent: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 400 15px/1.45 "Archivo", system-ui, sans-serif; font-variation-settings: "wdth" 100;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .quiet { color: var(--steel); }
  .hidden { display: none !important; }

  /* ---------- sign in ---------- */
  #signin { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  #signin form {
    width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius-m); padding: 28px;
  }
  #signin h1 { margin: 0 0 4px; font-size: 26px; font-weight: 750; font-variation-settings: "wdth" 75; letter-spacing: .01em; }
  #signin p { margin: 0 0 20px; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input[type=email], input[type=password], input[type=search] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-s);
    background: var(--panel);
  }
  .btn {
    display: inline-block; border: 0; border-radius: var(--radius-s); padding: 10px 16px;
    background: var(--blue); color: var(--on-accent); font-weight: 650; cursor: pointer;
  }
  .btn.full { width: 100%; margin-top: 20px; }
  .link { background: none; border: 0; color: var(--blue); cursor: pointer; padding: 0; font-weight: 600; }
  .error { color: var(--red); margin-top: 12px; min-height: 1.4em; }

  /* ---------- app shell ---------- */
  #app { display: grid; grid-template-columns: 360px 1fr; height: 100%; }
  #side { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #side header { padding: 18px 18px 12px; }
  .brand { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .home-link { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font: inherit; font-size: 19px; font-weight: 780;
               font-variation-settings: "wdth" 72; letter-spacing: .02em; }
  .home-link:hover { color: var(--blue); }
  .brand strong { font-size: 19px; font-weight: 780; font-variation-settings: "wdth" 72; letter-spacing: .02em; }
  #q { margin-top: 12px; font-size: 16px; padding: 12px 14px; border-width: 2px; }
  #q:focus { border-color: var(--blue); outline: none; }
  .hint { font-size: 13px; margin-top: 8px; }
  .update-box { margin: 10px 16px 14px; padding: 12px 14px; border-radius: var(--radius-m); background: var(--paper);
                border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; text-align: center; }
  .update-box strong { font-size: 14.5px; } .update-box span { font-size: 13px; color: var(--steel); }
  .update-box .btn { margin-top: 6px; width: 100%; background: #9AA3AB; color: #FFFFFF; }
  .update-box.ready { background: #E6F4EA; border-color: #2E7D4F; }
  .update-box.ready strong { color: #1B5E36; } .update-box.ready span { color: #2F4A3A; }
  .update-box.ready .btn { background: #2E7D4F; color: #FFFFFF; }
  @media (prefers-reduced-motion: no-preference) { .update-box.ready .btn { animation: pulse 2s ease-in-out 3; } }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(46, 125, 79, .25); } }
  #results:empty { flex: 0 0 auto; padding: 0; }
  #results:empty + .update-box { margin-top: auto; margin-bottom: auto; }
  #side .online { margin-top: auto; }
  .online { border-top: 1px solid var(--line); padding: 12px 18px 16px; max-height: 32vh; overflow: auto; }
  .online h3 { margin: 0 0 8px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--steel); }
  .online h3 .count { font-weight: 500; }
  .online ul { list-style: none; margin: 0; padding: 0; }
  .online li { display: flex; align-items: center; gap: 9px; padding: 4px 0; font-size: 14.5px; }
  .online li .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); flex: none; }
  .online li .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .online li .role { color: var(--steel); font-size: 13px; margin-left: auto; white-space: nowrap; }
  @media (max-width: 860px) { .online { display: none; } }
  #results { overflow: auto; padding: 4px 8px 16px; flex: 1; }
  .result {
    display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: var(--radius-s);
    padding: 10px 10px; cursor: pointer;
  }
  .result:hover, .result[aria-current="true"] { background: var(--blue-wash); }
  .result .name { font-weight: 650; }
  .result .sub { font-size: 13px; color: var(--steel); }
  .result .why { font-size: 12.5px; color: var(--blue); }

  #main { overflow: auto; min-width: 0; }
  .empty { height: 100%; display: grid; place-items: center; text-align: center; padding: 40px; color: var(--steel); }
  .empty h2 { color: var(--ink); font-size: 22px; font-weight: 700; font-variation-settings: "wdth" 80; margin: 0 0 6px; }

  /* ---------- customer file ---------- */
  .file { max-width: 1120px; padding: 28px 32px 64px; }
  .file-wrap { display: grid; grid-template-columns: minmax(0, 1120px) 200px; align-items: start; }
  .file-wrap .file { min-width: 0; }
  .file > section.block { scroll-margin-top: 16px; }
  .file-nav { position: sticky; top: 0; padding: 28px 16px 24px 0; display: flex; flex-direction: column; gap: 2px; max-height: 100vh; overflow: auto; }
  .file-nav .nav-head { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--steel); margin: 0 0 8px 12px; }
  .file-nav button { display: flex; justify-content: space-between; gap: 8px; text-align: left; background: none; border: 0;
                     border-left: 3px solid var(--line); padding: 7px 10px 7px 12px; cursor: pointer; color: var(--steel); font: inherit; font-size: 14.5px; }
  .file-nav button:hover { color: var(--ink); background: var(--panel); }
  .file-nav button.cur { color: var(--ink); font-weight: 650; border-left-color: var(--blue); }
  .file-nav button:first-of-type { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .file-nav .n { color: var(--steel); font-weight: 500; font-size: 12.5px; white-space: nowrap; }
  @media (max-width: 1180px) {
    .file-wrap { display: flex; flex-direction: column-reverse; align-items: stretch; }
    .file-nav { position: sticky; top: 0; z-index: 3; flex-direction: row; overflow-x: auto; max-height: none; width: 100%; box-sizing: border-box;
                padding: 8px 16px; background: var(--paper); border-bottom: 1px solid var(--line); }
    .file-nav .nav-head { display: none; }
    .file-nav button { border-left: 0; border-bottom: 3px solid transparent; white-space: nowrap; padding: 6px 10px; }
    .file-nav button.cur { border-bottom-color: var(--blue); }
    .file-nav .n { display: none; }
    .file-nav button:first-of-type { max-width: 180px; }
  }
  .plate {
    display: grid; grid-template-columns: 1fr auto; gap: 8px 24px; align-items: end;
    padding-bottom: 20px; border-bottom: 2px solid var(--ink);
  }
  .plate h1 {
    margin: 0; font-size: 40px; line-height: 1.05; font-weight: 800; font-variation-settings: "wdth" 68;
    letter-spacing: .005em;
  }
  .plate .meta { color: var(--steel); margin-top: 6px; }
  .balance { text-align: right; }
  .balance .amt { font-size: 28px; font-weight: 750; font-variation-settings: "wdth" 80; }
  .balance.due .amt { color: var(--amber); }
  .flags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .flag { padding: 6px 10px; border-radius: var(--radius-s); font-weight: 600; font-size: 14px; }
  .flag.red { background: var(--red-wash); color: var(--red); }
  .flag.amber { background: var(--amber-wash); color: var(--amber); }
  .flag.blue { background: var(--blue-wash); color: var(--blue); }

  .contacts { display: flex; flex-wrap: wrap; gap: 6px 24px; margin-top: 16px; }
  .contacts a { color: var(--ink); text-decoration: none; }
  .contacts a:hover { text-decoration: underline; }
  .contacts .kind { color: var(--steel); font-size: 13px; margin-right: 6px; }

  section.block { margin-top: 36px; }
  section.block > h2 {
    font-size: 21px; font-weight: 720; font-variation-settings: "wdth" 78; margin: 0 0 12px;
    display: flex; align-items: baseline; gap: 10px;
  }
  section.block > h2 .count { font-size: 14px; font-weight: 500; color: var(--steel); font-variation-settings: "wdth" 100; }

  .locs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .loc-tab {
    border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .loc-tab[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .address { font-size: 17px; font-weight: 600; }
  .address-note { margin-top: 4px; font-size: 14px; }

  /* equipment with coverage bars: the one strong visual */
  .equip { display: grid; gap: 2px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius-m); overflow: hidden; }
  .eq { background: var(--panel); padding: 14px 16px; display: grid; grid-template-columns: minmax(200px, 300px) 1fr; gap: 20px; align-items: center; }
  .eq .what { font-weight: 650; }
  .eq .model { font-size: 13.5px; color: var(--steel); }
  .bar { position: relative; height: 40px; }
  .bar .track { position: absolute; left: 0; right: 0; top: 7px; height: 8px; background: var(--paper); border-radius: 4px; }
  .bar .parts, .bar .labour { position: absolute; height: 8px; border-radius: 4px; }
  .bar .parts { top: 7px; background: var(--blue); }
  .bar .labour { top: 18px; background: var(--green); height: 5px; }
  .bar .today { position: absolute; top: 0; bottom: 8px; width: 2px; background: var(--ink); }
  .bar .ends { position: absolute; top: 24px; left: 0; right: 0; font-size: 12px; color: var(--steel); display: flex; justify-content: space-between; }
  .cover-text { font-size: 13.5px; margin-top: 4px; }
  .cover-text .ok { color: var(--green); font-weight: 600; }
  .cover-text .gone { color: var(--steel); }
  .legend { display: flex; gap: 18px; font-size: 13px; color: var(--steel); margin: 0 0 10px; }
  .legend i { display: inline-block; width: 18px; height: 6px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }

  .note-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .note-tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px 9px; cursor: pointer;
              font-weight: 600; color: var(--steel); margin-bottom: -1px; }
  .note-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--blue); }
  .note-tab .count { font-weight: 500; color: var(--steel); }
  .notes-list { max-width: 820px; max-height: 360px; overflow-y: auto;
                background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 4px 16px; }
  .notes-list:focus-visible { outline-offset: 0; }
  .scroll-box { max-height: 420px; overflow: auto; background: var(--panel);
                border: 1px solid var(--line); border-radius: var(--radius-m); }
  .scroll-box:focus-visible { outline-offset: 0; }
  .scroll-box table { border: 0; border-radius: 0; overflow: visible; }
  .scroll-box th { position: sticky; top: 0; z-index: 1; box-shadow: inset 0 -1px 0 var(--line); }
  .scroll-box .equip { border: 0; border-radius: 0; }
  .scroll-box.plans-box { padding: 10px; background: var(--paper); }
  .scroll-box.locs-box { max-height: 128px; padding: 8px; background: var(--paper); margin-bottom: 14px; }
  .scroll-box.locs-box .locs { margin-bottom: 0; }
  .box-jump { display: flex; justify-content: flex-end; max-width: 100%; }
  .notes-list + .box-jump, .box-jump:has(+ .notes-list) { max-width: 820px; }
  .box-jump.above { margin: 0 0 4px; } .box-jump.below { margin: 4px 0 0; }
  .box-jump .link { font-size: 13px; font-weight: 600; }
  .notes-foot { font-size: 13px; color: var(--steel); margin-top: 6px; }
  .note-add { max-width: 820px; margin-top: 12px; }
  .note-add textarea { width: 100%; min-height: 72px; resize: vertical; padding: 10px 12px; border: 1px solid var(--line);
                       border-radius: var(--radius-s); background: var(--panel); font: inherit; color: inherit; }
  .note-add textarea:focus { border-color: var(--blue); outline: none; }
  .note-add .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 8px; }
  .note-add select { padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--panel); font: inherit; color: inherit; max-width: 100%; }
  .note-add .check { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; margin: 0; }
  .note-add .btn[disabled] { opacity: .55; cursor: default; }
  .note-add .msg { font-size: 13.5px; }
  .note-add .msg.err { color: var(--red); }
  .note-add .msg.ok { color: var(--green); }
  .podium-link { font-size: 13px; font-weight: 600; color: var(--blue); white-space: nowrap; }
  .note-actions { display: inline-flex; gap: 14px; margin-left: 12px; }
  .note-actions .link { font-size: 13px; font-weight: 600; }
  .note-actions .link.danger { color: var(--red); }
  .note-edit textarea { width: 100%; min-height: 70px; resize: vertical; padding: 8px 10px; border: 1px solid var(--blue);
                        border-radius: var(--radius-s); background: var(--panel); font: inherit; color: inherit; }
  .note-edit .edit-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 6px; }
  .btn.quiet-btn { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
  .confirm { color: var(--red); font-weight: 600; font-size: 13.5px; }
  .note.fresh { animation: none; }
  .live-bar { background: var(--blue-wash); color: var(--ink); border-radius: var(--radius-s); padding: 7px 12px; font-size: 13.5px; margin: 0 0 8px; max-width: 820px; }
  @media (prefers-reduced-motion: no-preference) { .note.fresh { animation: flash 1.6s ease-out; } }
  @keyframes flash { from { background: var(--blue-wash); } to { background: transparent; } }
  .note { white-space: pre-wrap; padding: 10px 0; border-top: 1px solid var(--line); }
  .note:first-child { border-top: 0; }
  .note.pin { --pin: var(--amber-wash); background: var(--pin); border-left: 4px solid color-mix(in srgb, var(--pin) 45%, #000 40%);
              padding: 10px 12px; margin: 8px 0; border-top: 0; border-radius: var(--radius-s); color: #1C2630; }
  .note.pin .when { color: #4A5966; } .note.pin .link { color: #1F5FA8; } .note.pin .link.danger { color: #B3261E; }
  .note.pin .podium-link, .note.pin .job-link { color: #1F5FA8; }
  .note .pin-label { color: color-mix(in srgb, var(--pin) 30%, #000 65%); font-weight: 700; font-size: 13px; display: block; margin-bottom: 2px; }
  .note .when { font-size: 12.5px; color: var(--steel); display: block; margin-top: 2px; }
  .notes-empty { padding: 12px 0; color: var(--steel); }
  .plans { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .plan { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--blue); border-radius: var(--radius-s); padding: 12px 14px; }
  .plan.off { border-left-color: var(--line); color: var(--steel); }
  .plan .pname { font-weight: 650; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-m); overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 13px; font-weight: 600; color: var(--steel); background: var(--paper); }
  tr:last-child td { border-bottom: 0; }
  td.r, th.r { text-align: right; }
  td.num:first-child { white-space: nowrap; }
  .status { font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .s-done { background: var(--green-wash); color: var(--green); }
  .s-open { background: var(--blue-wash); color: var(--blue); }
  .s-warn { background: var(--amber-wash); color: var(--amber); }
  .s-off { background: var(--paper); color: var(--steel); }
  .job-row { cursor: pointer; }
  .job-row:hover td { background: var(--blue-wash); }
  .job-detail td { background: var(--paper); font-size: 14px; }
  .visit { margin: 2px 0; }
  .more { margin-top: 10px; }
  .loading { padding: 40px; color: var(--steel); }
  .side-links { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14.5px; }
  .brand { flex-wrap: wrap; row-gap: 6px; }
  .side-links .link { white-space: nowrap; }
  .staff { max-width: 1120px; padding: 28px 32px 64px; }
  .staff h1 { margin: 0 0 6px; font-size: 34px; font-weight: 800; font-variation-settings: "wdth" 68; }
  .staff .lead { color: var(--steel); max-width: 760px; margin: 0 0 22px; }
  .staff table td, .staff table th { vertical-align: middle; }
  .staff th.perm { text-align: center; font-size: 12.5px; line-height: 1.2; min-width: 56px; }
  .staff th, .staff td { padding-left: 8px; padding-right: 8px; }
  .staff td.perm { text-align: center; }
  .staff input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--blue); }
  .staff select, .staff input[type=text], .staff input[type=email] { padding: 7px 9px; border: 1px solid var(--line);
      border-radius: var(--radius-s); background: var(--panel); font: inherit; color: inherit; }
  .staff .all { font-size: 13px; color: var(--steel); }
  .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; max-width: 900px; }
  .theme-card { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 14px;
                background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-m); }
  .theme-card.on { border: 2px solid var(--blue); padding: 13px; }
  .theme-card .quiet { font-size: 13px; }
  .theme-sw { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .theme-sw .sw { display: flex; flex-direction: column; align-items: stretch; gap: 3px; cursor: pointer; margin: 0; }
  .theme-sw .sw input { width: 100%; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: var(--radius-s); background: none; cursor: pointer; }
  .theme-sw .sw input::-webkit-color-swatch-wrapper { padding: 0; }
  .theme-sw .sw input::-webkit-color-swatch { border: 0; border-radius: 3px; }
  .theme-sw .sw input::-moz-color-swatch { border: 0; border-radius: 3px; }
  .theme-sw .sw span { font-size: 11px; line-height: 1.2; color: var(--steel); text-align: center; }
  .theme-btns { display: flex; align-items: center; gap: 12px; margin-top: 4px; min-height: 36px; }

  @media (max-width: 860px) { .slot-row { grid-template-columns: 52px 48px 1fr; } .slot-row .slot-preview, .slot-move { grid-column: 1 / -1; } }
  .hist-filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 6px; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
  .chip[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .hist { list-style: none; margin: 0 0 16px; padding: 0; max-width: 980px; }
  .hist-day { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--steel); padding: 18px 0 6px; border-bottom: 1px solid var(--line); }
  .hist-row { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .hist-time { color: var(--steel); font-size: 13.5px; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .hist-kind { display: inline-block; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--steel);
               border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-right: 4px; vertical-align: 1px; }
  .hist-row.delete .hist-kind { color: var(--red); border-color: var(--red); }
  .hist-row.restore .hist-kind { color: var(--green); border-color: var(--green); }
  .hist-detail { white-space: pre-wrap; margin-top: 6px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-s); font-size: 14px; }
  .hist-done { margin-top: 6px; color: var(--green); font-size: 13.5px; font-weight: 600; }
  .hist-act { min-width: 96px; text-align: right; }
  .hist-act .btn { padding: 6px 12px; }
  @media (max-width: 700px) { .hist-row { grid-template-columns: 1fr; gap: 4px; } .hist-act { text-align: left; } }
  .approve-banner { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
                    background: var(--amber-wash); border: 1px solid var(--amber); border-radius: var(--radius-m); padding: 12px 16px; margin: 0 0 16px; }
  .approve-banner span { display: flex; gap: 8px; }
  .staff .waiting { font-size: 12.5px; color: var(--amber); font-weight: 600; white-space: nowrap; }
  .badge-n { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff;
             font-size: 12px; font-weight: 700; line-height: 18px; text-align: center; }
  .staff .name-cell { white-space: nowrap; }
  .staff .name-cell input { width: 150px; }
  .staff-wrap { overflow-x: auto; }
  .staff .link.danger { color: var(--red); }
  .staff input[type=checkbox]:disabled:checked { accent-color: var(--steel); }
  .staff .inactive td { color: var(--steel); }
  .add-staff { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: 10px; align-items: end; margin-top: 18px;
               background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 16px; }
  .add-staff label { margin: 0 0 4px; font-size: 13.5px; }
  .add-staff input, .add-staff select { width: 100%; }
  .staff-msg { margin-top: 10px; min-height: 1.4em; font-size: 14px; }
  .staff-msg.err { color: var(--red); } .staff-msg.ok { color: var(--green); }
  .steps { margin: 26px 0 0; color: var(--steel); max-width: 760px; font-size: 14px; }
  .steps li { margin: 4px 0; }
  @media (max-width: 860px) { .add-staff { grid-template-columns: 1fr; } .staff { padding: 20px 16px; } .staff-wrap { overflow-x: auto; } }

  @media (max-width: 860px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    #side { border-right: 0; border-bottom: 1px solid var(--line); max-height: 45vh; }
    .file { padding: 20px 16px 48px; }
    .plate { grid-template-columns: 1fr; }
    .balance { text-align: left; }
    .plate h1 { font-size: 32px; }
    .eq { grid-template-columns: 1fr; gap: 8px; }
    .hide-sm { display: none; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .file { animation: arrive .18s ease-out; }
    @keyframes arrive { from { opacity: .4; } to { opacity: 1; } }
  }
</style>
</head>
<body>

<div id="signin" class="hidden">
  <form id="signin-form">
    <h1>Reid Heating &amp; Cooling</h1>
    <p class="quiet">Sign in with your work email.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="btn full" type="submit">Sign in</button>
    <div class="error" id="signin-error" role="alert"></div>
  </form>
</div>

<div id="app" class="hidden">
  <aside id="side">
    <header>
      <div class="brand"><button class="home-link" id="home-link" title="Back to your last customer">Customers</button><span class="side-links"><button class="link hidden" id="history-link">History</button><button class="link hidden" id="settings-link">Settings</button><button class="link hidden" id="staff-link">Staff</button><button class="link" id="signout">Sign out</button></span></div>
      <input id="q" type="search" placeholder="Name, phone, address, invoice, serial…" autocomplete="off" aria-label="Search customers">
      <div class="hint quiet">Search by anything: old ServiceTitan numbers work too.</div>
    </header>
    <div id="results" role="list"></div>
    <section class="update-box" id="update-box" role="status">
      <strong id="update-title">You're up to date</strong>
      <span id="update-text">This button turns green when there's a new update.</span>
      <button class="btn" type="button" id="update-btn">Refresh</button>
    </section>
    <section class="online hidden" id="online" aria-label="Staff online now">
      <h3>Online now <span class="count" id="online-count"></span></h3>
      <ul id="online-list"></ul>
    </section>
  </aside>
  <main id="main">
    <div class="empty"><div><h2>Find a customer</h2>Type in the search box to open their file.</div></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const CONFIG = Object.assign({
  url: "https://hplvhfkvwcwackyauirw.supabase.co",
  key: "sb_publishable_HNOn3RjBOJbXeoWHnGKKYQ_7leKNuXk"
}, window.APP_CONFIG || {});

const db = supabase.createClient(CONFIG.url, CONFIG.key,
  CONFIG.testToken ? { global: { headers: { Authorization: "Bearer " + CONFIG.testToken } }, auth: { persistSession: false } } : {});

const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => (n == null ? "" : Number(n).toLocaleString("en-CA", { style: "currency", currency: "CAD" }));
const fmtDate = d => d ? new Date(d.length === 10 ? d + "T12:00:00" : d).toLocaleDateString("en-CA", { year: "numeric", month: "short", day: "numeric" }) : "";
const monthYear = d => d ? new Date(d + "T12:00:00").toLocaleDateString("en-CA", { year: "numeric", month: "short" }) : "";
const phoneFmt = v => { const d = String(v).replace(/\D/g, ""); return d.length === 10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : v; };
const STATUS = {
  completed: ["Completed", "s-done"], invoiced: ["Invoiced", "s-done"], closed: ["Closed", "s-done"],
  scheduled: ["Scheduled", "s-open"], in_progress: ["In progress", "s-open"], new: ["New", "s-open"],
  on_hold: ["On hold", "s-warn"], cancelled: ["Cancelled", "s-off"],
  paid: ["Paid", "s-done"], partially_paid: ["Part paid", "s-warn"], posted: ["Open", "s-warn"], sent: ["Sent", "s-open"],
  draft: ["Draft", "s-off"], void: ["Void", "s-off"], submitted_to_partner: ["With partner", "s-open"],
  accepted: ["Sold", "s-done"], lost: ["Dismissed", "s-off"], declined: ["Declined", "s-off"], viewed: ["Viewed", "s-open"],
  expired: ["Expired", "s-off"], active: ["Active", "s-done"]
};
const badge = s => { const [t, c] = STATUS[s] || [s, "s-off"]; return `<span class="status ${c}">${esc(t)}</span>`; };

const ME = { role: null, perms: new Set(), email: "" };
const can = code => ME.perms.has(code);

/* ---------------- sign in ---------------- */
async function start() {
  if (CONFIG.testToken) return showApp();
  const { data } = await db.auth.getSession();
  data.session ? showApp() : showSignin();
}
function showSignin() { $("#app").classList.add("hidden"); $("#signin").classList.remove("hidden"); $("#email").focus(); }
async function showApp() {
  $("#signin").classList.add("hidden"); $("#app").classList.remove("hidden");
  const { data, error } = await db.rpc("current_staff_role");
  ME.role = data || null;
  try {
    ME.email = CONFIG.testToken ? JSON.parse(atob(CONFIG.testToken.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).email
                                : (await db.auth.getSession()).data.session?.user?.email;
    ME.email = (ME.email || "").toLowerCase();
  } catch { ME.email = ""; }
  const perms = await db.rpc("my_permissions");
  ME.perms = new Set(perms.data || []);
  $("#staff-link").classList.toggle("hidden", !ME.perms.has("staff.manage"));
  $("#settings-link").classList.toggle("hidden", !ME.role);
  $("#history-link").classList.toggle("hidden", !ME.perms.has("history.restore"));
  await loadPinSlots();
  loadTheme();
  checkForUpdate();
  if (error || !data) {
    $("#main").innerHTML = `<div class="empty"><div><h2>No access yet</h2>This login isn't set up as staff. Ask the owner to add your email to the staff list.</div></div>`;
  }
  $("#q").focus();
  if (data) { startOnline(); startLiveNotes(); }
  if (location.hash === "#staff" && can("staff.manage")) return openStaff();
  if (location.hash === "#settings" && ME.role) return openSettings();
  if (location.hash === "#history" && can("history.restore")) return openHistory();
  const id = new URLSearchParams(location.hash.slice(1)).get("customer");
  if (id) openCustomer(Number(id));
}
$("#signin-form").addEventListener("submit", async e => {
  e.preventDefault();
  $("#signin-error").textContent = "";
  const { error } = await db.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#password").value });
  if (error) { $("#signin-error").textContent = "That email and password didn't match. Check them and try again."; return; }
  showApp();
});
/* ---------------- scroll boxes hand off to the page at their ends ---------------- */
document.addEventListener("wheel", e => {
  const box = e.target.closest(".scroll-box, .notes-list");
  if (!box || e.ctrlKey || Math.abs(e.deltaY) < Math.abs(e.deltaX)) return;
  const atTop = box.scrollTop <= 0, atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 1;
  if ((e.deltaY > 0 && atBottom) || (e.deltaY < 0 && atTop)) {
    e.preventDefault();
    const page = $("#main"), dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * page.clientHeight : e.deltaY;
    if (page.scrollHeight > page.clientHeight) page.scrollBy(0, dy); else window.scrollBy(0, dy);
  }
}, { passive: false });

/* ---------------- who's online ---------------- */
let onlineTimer = null;
const ROLE_NAMES = { owner: "Owner", admin: "Admin", office: "Office", dispatcher: "Dispatch", accounting: "Accounting",
                     warehouse: "Warehouse", technician: "Tech", sales: "Sales", read_only: "View only" };
async function checkIn() {
  if (document.hidden) return;
  const { data, error } = await db.rpc("check_in", { p_leaving: false });
  if (error) { $("#online").classList.add("hidden"); return; }   // setup step 06 not run yet
  $("#online").classList.remove("hidden");
  $("#online-count").textContent = data.length;
  if (ME.role === "owner") {
    const p = await db.rpc("my_pending_approvals");
    const n = p.error ? 0 : p.data || 0;
    $("#staff-link").innerHTML = n ? `Staff <span class="badge-n" title="${n} waiting for your approval">${n}</span>` : "Staff";
  }
  $("#online-list").innerHTML = data.map(u => `<li title="${esc(u.login_email)}"><span class="dot"></span>
    <span class="who">${esc(u.name || u.login_email.split("@")[0])}${u.is_me ? " (you)" : ""}</span>
    <span class="role">${esc(ROLE_NAMES[u.role] || u.role)}</span></li>`).join("");
}
function startOnline() { clearInterval(onlineTimer); checkIn(); onlineTimer = setInterval(checkIn, 60000); }
document.addEventListener("visibilitychange", () => { if (!document.hidden && onlineTimer) checkIn(); });

$("#signout").addEventListener("click", async () => { clearInterval(onlineTimer); onlineTimer = null;
  await db.rpc("check_in", { p_leaving: true }); await db.auth.signOut(); location.hash = ""; showSignin(); });

/* ---------------- search ---------------- */
let searchTimer, searchSeq = 0;
$("#q").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 220); });
$("#q").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); $("#results .result")?.focus(); }
  if (e.key === "Enter") { const first = $("#results .result"); if (first) first.click(); }
});
$("#results").addEventListener("keydown", e => {
  const items = [...document.querySelectorAll("#results .result")], i = items.indexOf(document.activeElement);
  if (e.key === "ArrowDown" && i < items.length - 1) { e.preventDefault(); items[i + 1].focus(); }
  if (e.key === "ArrowUp") { e.preventDefault(); (i > 0 ? items[i - 1] : $("#q")).focus(); }
});

const WHY = { job: "Job", invoice: "Invoice", estimate: "Estimate", equipment: "Equipment", payment: "Payment",
              permit: "Permit", manufacturer_claim: "Manufacturer claim", supplier_claim: "Supplier claim" };

async function runSearch() {
  const q = $("#q").value.trim(), seq = ++searchSeq, box = $("#results");
  if (q.length < 2) { box.innerHTML = ""; return; }
  box.innerHTML = `<div class="hint quiet" style="padding:10px">Searching…</div>`;
  const { data, error } = await db.rpc("global_search", { q, max_results: 40 });
  if (seq !== searchSeq) return;
  if (error) { box.innerHTML = `<div class="error" style="padding:10px">Search failed: ${esc(error.message)}</div>`; return; }
  const ids = [...new Set(data.map(r => r.customer_id).filter(Boolean))];
  if (!ids.length) { box.innerHTML = `<div class="hint quiet" style="padding:10px">Nothing matches "${esc(q)}". Try part of a name, a phone number, or a street.</div>`; return; }
  const { data: custs } = await db.from("customers")
    .select("id, display_name, status, locations(street, city)").in("id", ids.slice(0, 40));
  if (seq !== searchSeq) return;
  const byId = Object.fromEntries((custs || []).map(c => [c.id, c]));
  const why = {};
  data.forEach(r => { if (r.entity_type !== "customer" && r.customer_id && !why[r.customer_id]) why[r.customer_id] = `${WHY[r.entity_type] || r.entity_type}: ${r.title.replace(/^(Job|Invoice|Estimate|Payment|PO|Permit) /, "")}${r.subtitle && r.entity_type === "equipment" ? " " + r.subtitle : ""}`; });
  box.innerHTML = ids.filter(id => byId[id]).map(id => {
    const c = byId[id], l = (c.locations || [])[0];
    return `<button class="result" role="listitem" data-id="${id}">
      <div class="name">${esc(c.display_name)}${c.status !== "active" ? ' <span class="quiet">(inactive)</span>' : ""}</div>
      <div class="sub">${l ? esc(l.street + ", " + l.city) : ""}</div>
      ${why[id] ? `<div class="why">${esc(why[id])}</div>` : ""}</button>`;
  }).join("");
  box.querySelectorAll(".result").forEach(b => b.addEventListener("click", () => openCustomer(Number(b.dataset.id))));
}

/* ---------------- customer file ---------------- */
let current = null;
const LAST_KEY = "reid.lastCustomer";
let lastCustomer = (() => { try { return Number(localStorage.getItem(LAST_KEY)) || null; } catch { return null; } })();
const SEARCH_SCREEN = `<div class="empty"><div><h2>Find a customer</h2>Type in the search box to open their file.</div></div>`;
$("#home-link").addEventListener("click", () => {
  const showing = location.hash === "#customer=" + lastCustomer && document.querySelector(".file .plate");
  if (lastCustomer && !showing) return openCustomer(lastCustomer);
  history.replaceState(null, "", location.pathname);
  $("#main").innerHTML = SEARCH_SCREEN;
  $("#q").value = ""; $("#results").innerHTML = ""; $("#q").focus();
});

async function openCustomer(id) {
  lastCustomer = id; try { localStorage.setItem(LAST_KEY, String(id)); } catch {}
  document.querySelectorAll("#results .result").forEach(b => b.setAttribute("aria-current", b.dataset.id == id));
  location.hash = "customer=" + id;
  $("#main").innerHTML = `<div class="loading">Opening file…</div>`;
  const [cust, plans, jobs, invoices, estimates] = await Promise.all([
    db.from("customers").select("*, customer_contacts(*), locations(*), customer_flags(*)").eq("id", id).single(),
    db.from("memberships").select("*, plan_types(name)").eq("customer_id", id).order("start_date", { ascending: false }),
    db.from("jobs").select("id, job_number, status, summary, description, priority, created_at, completed_at, location_id, job_types(name), business_units(name), partners(name), visits(id, visit_number, scheduled_date, status, visit_assignments(role, employees(first_name, last_name)))")
      .eq("customer_id", id).order("created_at", { ascending: false }).limit(300),
    db.from("invoices").select("id, invoice_number, invoice_date, total, balance_due, status, job_id, location_id")
      .eq("customer_id", id).order("invoice_date", { ascending: false }).limit(300),
    db.from("estimates").select("id, estimate_number, status, created_at, job_id, location_id, estimate_options!estimate_options_estimate_id_fkey(name, estimate_lines(line_total))")
      .eq("customer_id", id).order("created_at", { ascending: false }).limit(100)
  ]);
  if (cust.error) { $("#main").innerHTML = `<div class="empty"><div><h2>Couldn't open this customer</h2>${esc(cust.error.message)}</div></div>`; return; }
  const c = cust.data;
  const locIds = (c.locations || []).map(l => l.id);
  const eq = locIds.length ? await db.from("equipment")
    .select("*, equipment_types(name), manufacturers(name), warranty_coverages(*)")
    .in("location_id", locIds).order("install_date", { ascending: false, nullsFirst: false }) : { data: [] };
  const noteFilter = [`and(entity_type.eq.customer,entity_id.eq.${id})`]
    .concat(locIds.length ? [`and(entity_type.eq.location,entity_id.in.(${locIds.join(",")}))`] : []).join(",");
  const jobIds = (jobs.data || []).map(j => j.id);
  const allNotes = await fetchNotes(noteFilter, jobIds);
  current = { c, noteFilter, jobIds, notes: allNotes, plans: plans.data || [], jobs: jobs.data || [], invoices: invoices.data || [],
              estimates: estimates.data || [], equipment: eq.data || [],
              loc: (c.locations || []).find(l => l.active)?.id ?? locIds[0] };
  renderFile();
}

const NOTE_BASE = "id, entity_type, entity_id, body, pinned, created_at, app_users(login_email, employees(first_name, last_name))";
let NOTE_EXTRA = ", source, pin_order";
async function fetchNotes(noteFilter, jobIds) {
  const q = cols => db.from("notes").select(cols).or(noteFilter).order("created_at", { ascending: false });
  let notes = await q(NOTE_BASE + NOTE_EXTRA);
  if (notes.error) { NOTE_EXTRA = ", source"; notes = await q(NOTE_BASE + NOTE_EXTRA); }   // setup step 09 not run yet
  if (notes.error) { NOTE_EXTRA = ""; notes = await q(NOTE_BASE); }                       // setup step 05 not run yet
  const out = notes.data || [];
  for (let i = 0; i < jobIds.length; i += 150) {
    const r = await db.from("notes").select(NOTE_BASE + (NOTE_EXTRA.includes("pin_order") ? ", pin_order" : ""))
      .eq("entity_type", "job").in("entity_id", jobIds.slice(i, i + 150)).order("created_at", { ascending: false });
    if (r.data) out.push(...r.data);
  }
  return out.sort(noteSort);
}
function noteSort(a, b) {
  if (a.pinned !== b.pinned) return b.pinned - a.pinned;
  if (a.pinned) { const d = (a.pin_order ?? 999) - (b.pin_order ?? 999); if (d) return d; }
  return (b.created_at || "").localeCompare(a.created_at || "");
}
/* ---------------- live notes: everyone sees changes right away ---------------- */
let liveStarted = false, liveConnected = false, liveDebounce = null;
function startLiveNotes() {
  if (liveStarted) return; liveStarted = true;
  try {
    db.channel("notes-live")
      .on("postgres_changes", { event: "*", schema: "public", table: "notes" }, payload => {
        const r = payload.new && payload.new.entity_type ? payload.new : null;
        if (r && !noteBelongsHere(r)) return;
        scheduleNotesRefresh();
      })
      .subscribe(status => { liveConnected = status === "SUBSCRIBED"; });
  } catch { liveConnected = false; }
  // back-up check, used only when the live connection is down
  setInterval(() => { if (!liveConnected) scheduleNotesRefresh(); }, CONFIG.pollMs || 20000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) scheduleNotesRefresh(); });
}
function noteBelongsHere(r) {
  if (!current) return false;
  if (r.entity_type === "customer") return r.entity_id === current.c.id;
  if (r.entity_type === "location") return (current.c.locations || []).some(l => l.id === r.entity_id);
  if (r.entity_type === "job") return current.jobIds.includes(r.entity_id);
  return false;
}
function scheduleNotesRefresh() {
  clearTimeout(liveDebounce);
  liveDebounce = setTimeout(refreshNotesLive, 700);
}
const notesSig = list => list.map(n => `${n.id}:${n.pinned}:${n.pin_order ?? ""}:${n.body}`).join("|");
async function refreshNotesLive() {
  if (!current || document.hidden || !document.querySelector(".file .notes-list")) return;
  const fileId = current.c.id;
  const fresh = await fetchNotes(current.noteFilter, current.jobIds);
  if (!current || current.c.id !== fileId) return;                       // they opened another customer meanwhile
  if (notesSig(fresh) === notesSig(current.pendingNotes || current.notes)) return;
  const known = new Set(current.notes.map(n => n.id));
  fresh.forEach(n => { if (!known.has(n.id)) n.fresh = true; });
  if (document.querySelector(".note-edit, .note-actions .confirm")) {     // someone is mid-edit: don't yank the screen
    current.pendingNotes = fresh;
    if (!document.querySelector(".live-bar")) document.querySelector(".note-tabs")?.insertAdjacentHTML("beforebegin",
      `<div class="live-bar" role="status">Notes were changed by someone else. They'll show when you finish.</div>`);
    return;
  }
  current.notes = fresh;
  redrawKeepingPlace();
  setTimeout(() => current && current.notes.forEach(n => delete n.fresh), 2000);
}
function redrawKeepingPlace() {
  const main = $("#main"), top = main.scrollTop, list = document.querySelector(".notes-list"), listTop = list ? list.scrollTop : 0;
  const text = $("#note-text")?.value, pin = $("#note-pin")?.checked, job = $("#note-job")?.value, focused = document.activeElement?.id;
  renderFile();
  main.scrollTop = top;
  const list2 = document.querySelector(".notes-list"); if (list2) list2.scrollTop = listTop;
  if ($("#note-text") && text != null) { $("#note-text").value = text; $("#note-pin").checked = !!pin; if (job && $("#note-job")) $("#note-job").value = job; }
  if (focused && document.getElementById(focused)) document.getElementById(focused).focus({ preventScroll: true });
}

function buildFileNav() {
  const nav = document.querySelector(".file-nav"); if (!nav) return;
  const secs = [...document.querySelectorAll(".file > section.block")];
  secs.forEach((sec, i) => sec.id = "sec-" + i);
  const SHORT = { "Service address": "Address", "Equipment and coverage": "Equipment", "Job history": "Jobs" };
  const title = t => { const h = t.querySelector("h2").childNodes[0].textContent.trim(); return SHORT[h] || h; };
  const count = t => ((t.querySelector("h2 .count")?.textContent || "").match(/\d[\d,]*\+?/) || [""])[0];
  nav.innerHTML = `<div class="nav-head">On this file</div>
    <button type="button" data-sec="top" class="cur">${esc(current.c.display_name)}</button>` +
    secs.map(sec => `<button type="button" data-sec="${sec.id}">${esc(title(sec))}${count(sec) ? `<span class="n">${esc(count(sec))}</span>` : ""}</button>`).join("");
  nav.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.sec === "top") $("#main").scrollTo({ top: 0, behavior: "smooth" });
    else document.getElementById(b.dataset.sec).scrollIntoView({ behavior: "smooth", block: "start" });
  }));
  markFileNav();
}
function markFileNav() {
  const nav = document.querySelector(".file-nav"); if (!nav) return;
  const main = $("#main"), mainTop = main.getBoundingClientRect().top;
  let cur = "top";
  document.querySelectorAll(".file > section.block").forEach(sec => { if (sec.getBoundingClientRect().top - mainTop < 140) cur = sec.id; });
  if (main.scrollTop + main.clientHeight >= main.scrollHeight - 4) { const all = document.querySelectorAll(".file > section.block"); if (all.length) cur = all[all.length - 1].id; }
  nav.querySelectorAll("button").forEach(b => b.classList.toggle("cur", b.dataset.sec === cur));
}
$("#main").addEventListener("scroll", () => requestAnimationFrame(markFileNav), { passive: true });

function addBoxJumps() {
  document.querySelectorAll(".box-jump").forEach(j => j.remove());
  document.querySelectorAll("#main .scroll-box, #main .notes-list").forEach(box => {
    if (box.scrollHeight <= box.clientHeight + 2) return;
    const mk = (cls, label, where) => {
      const bar = document.createElement("div"); bar.className = "box-jump " + cls;
      bar.innerHTML = `<button class="link" type="button">${label}</button>`;
      bar.firstChild.addEventListener("click", () => box.scrollTo({ top: where === "top" ? 0 : box.scrollHeight, behavior: "smooth" }));
      return bar;
    };
    box.before(mk("above", "&darr; Go to bottom", "bottom"));
    box.after(mk("below", "&uarr; Go to top", "top"));
  });
}

function podiumBody(text) {
  const m = text.match(/\s*(https:\/\/app\.podium\.com\/[^\s]+)\s*$/);
  const body = m ? text.slice(0, m.index) : text;
  return esc(body) + (m ? ` <a class="podium-link" href="${esc(m[1])}" target="_blank" rel="noopener">Open in Podium</a>` : "");
}

function noteHtml(n, hide, job, rank, pinCount) {
  const jobLabel = job ? `<button class="link job-link" data-goto-job="${job.id}">Job ${esc(job.job_number)}${job.job_types?.name ? ", " + esc(job.job_types.name) : ""}</button><br>` : "";
  const who = n.app_users ? (n.app_users.employees ? `${n.app_users.employees.first_name} ${n.app_users.employees.last_name}`.trim() : n.app_users.login_email) : "";
  const pinTools = !can("notes.edit") || rank === undefined ? "" : n.pinned
    ? `${rank > 0 ? `<button class="link" data-pin-move="up" data-note-id="${n.id}" title="Move up" aria-label="Move pinned note up">&uarr; Up</button>` : ""}${rank < pinCount - 1 ? `<button class="link" data-pin-move="down" data-note-id="${n.id}" title="Move down" aria-label="Move pinned note down">&darr; Down</button>` : ""}<button class="link" data-pin-set="0" data-note-id="${n.id}">Unpin</button>`
    : `<button class="link" data-pin-set="1" data-note-id="${n.id}">Pin</button>`;
  const actions = (can("notes.edit") || can("notes.delete")) ? `<span class="note-actions">${pinTools}${can("notes.edit") ? `<button class="link" data-edit-note="${n.id}">Edit</button>` : ""}${can("notes.delete") ? `<button class="link danger" data-delete-note="${n.id}">Delete</button>` : ""}</span>` : "";
  const pinStyle = n.pinned && rank != null ? ` style="--pin:${pinColor(rank)}"` : "";
  return `<div class="note${n.pinned ? " pin" : ""}${n.fresh ? " fresh" : ""}${hide === true ? " hidden" : ""}"${pinStyle} data-note="${n.id}">${n.pinned ? `<span class="pin-label">Pinned${rank != null ? " " + (rank + 1) : ""}</span>` : ""}${jobLabel}<span class="body">${n.source === "podium" ? podiumBody(n.body) : esc(n.body)}</span><span class="when">${fmtDate(n.created_at)}${who ? ", by " + esc(who) : ""}${actions}</span></div>`;
}

function alertNote(btn, text) {
  const holder = btn.closest(".note-actions");
  holder.insertAdjacentHTML("beforeend", `<span class="confirm">${esc(text)}</span>`);
}

function startEditNote(id) {
  const n = current.notes.find(x => x.id === id), el = document.querySelector(`.note[data-note="${id}"]`);
  if (!n || !el) return;
  el.innerHTML = `<form class="note-edit"><textarea maxlength="10000" aria-label="Note text">${esc(n.body)}</textarea>
    <div class="edit-row"><label class="check"><input type="checkbox" ${n.pinned ? "checked" : ""}> Pin to the top</label>
    <button class="btn" type="submit">Save note</button><button class="btn quiet-btn" type="button" data-cancel>Cancel</button>
    <span class="msg" role="status"></span></div></form>`;
  const form = el.querySelector("form"), ta = form.querySelector("textarea");
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  form.querySelector("[data-cancel]").addEventListener("click", renderFile);
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const msg = form.querySelector(".msg"), btn = form.querySelector("button[type=submit]");
    if (!ta.value.trim()) { msg.className = "msg err"; msg.textContent = "The note can't be empty. Use Delete to remove it."; return; }
    btn.disabled = true; msg.className = "msg"; msg.textContent = "Saving…";
    const { data, error } = await db.rpc("edit_note", { p_note_id: id, p_body: ta.value, p_pinned: form.querySelector("input[type=checkbox]").checked });
    if (error) { btn.disabled = false; msg.className = "msg err"; msg.textContent = "Not saved: " + error.message; return; }
    await reloadNotes();
  });
}

function confirmDeleteNote(id, btn) {
  const holder = btn.parentElement;
  holder.innerHTML = `<span class="confirm">Delete this note?</span><button class="link danger" data-yes>Yes, delete</button><button class="link" data-no>Keep it</button>`;
  holder.querySelector("[data-no]").addEventListener("click", renderFile);
  holder.querySelector("[data-yes]").addEventListener("click", async () => {
    const { error } = await db.rpc("delete_note", { p_note_id: id });
    if (error) { holder.innerHTML = `<span class="confirm">Not deleted: ${esc(error.message)}</span>`; return; }
    current.notes = current.notes.filter(x => x.id !== id);
    renderFile();
  });
}

let THEME = "classic", THEME_CUSTOM = {};
function hexMix(a, b, t) {   // mix two #RRGGBB colours, t = share of b
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const [x, y] = [p(a), p(b)];
  return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join("");
}
const lum = h => { const [r, g, b] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4); return .2126 * r + .7152 * g + .0722 * b; };
function themeColors(id) {
  const t = THEMES.find(x => x.id === id) || THEMES[0], c = THEME_CUSTOM[id] || {};
  return Object.fromEntries(THEME_KEYS.map(([k], i) => [k, (c[k] || t.sw[i]).toUpperCase()]));
}
function applyTheme(id) {
  THEME = THEMES.some(t => t.id === id) ? id : "classic";
  const root = document.documentElement;
  if (THEME === "classic") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", THEME);
  ["paper", "panel", "blue", "ink", "blue-wash", "steel", "line", "on-accent"].forEach(v => root.style.removeProperty("--" + v));
  const custom = THEME_CUSTOM[THEME];
  if (custom && Object.keys(custom).length) {
    const c = themeColors(THEME);
    root.style.setProperty("--paper", c.paper); root.style.setProperty("--panel", c.panel);
    root.style.setProperty("--blue", c.blue); root.style.setProperty("--ink", c.ink);
    root.style.setProperty("--blue-wash", hexMix(c.panel, c.blue, .14));
    root.style.setProperty("--steel", hexMix(c.paper, c.ink, .62));
    root.style.setProperty("--line", hexMix(c.paper, c.ink, .16));
    root.style.setProperty("--on-accent", lum(c.blue) > .4 ? "#0E1620" : "#FFFFFF");
  }
  try { localStorage.setItem("reid.theme", JSON.stringify({ id: THEME, custom: THEME_CUSTOM })); } catch {}
}
try { const saved = JSON.parse(localStorage.getItem("reid.theme") || "null"); if (saved) { THEME_CUSTOM = saved.custom || {}; applyTheme(saved.id); } } catch {}
async function loadTheme() {
  const r = await db.rpc("my_theme");
  if (r.error) return;                                   // setup step 12 not run yet: keep what this computer remembers
  const prefs = r.data || {};
  THEME_CUSTOM = prefs.custom || {};
  applyTheme(prefs.id || "classic");
}
async function saveMyTheme() {
  const { error } = await db.rpc("save_my_theme", { p_prefs: { id: THEME, custom: THEME_CUSTOM } });
  return error;
}

/* ---------------- "there is a new update" button ---------------- */
const MY_VERSION = document.querySelector('meta[name="app-version"]')?.content || "dev";
async function checkForUpdate() {
  if (location.protocol === "file:" || MY_VERSION === "dev") return;
  try {
    const r = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const m = (await r.text()).match(/<meta name="app-version" content="([^"]+)"/);
    if (m && m[1] !== MY_VERSION && !$("#update-box").classList.contains("ready")) {
      $("#update-box").classList.add("ready");
      $("#update-title").textContent = "There is a new update";
      $("#update-text").textContent = "Hit this button to refresh the page.";
      $("#update-btn").textContent = "Refresh now";
    }
  } catch {}
}
$("#update-btn").addEventListener("click", () => location.reload());
setInterval(checkForUpdate, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkForUpdate(); });

/* ---------------- history: see changes and put things back ---------------- */
$("#history-link").addEventListener("click", () => openHistory());
let HIST = { kind: "all", rows: [], more: false };
const HIST_KINDS = [["all", "Everything"], ["deleted", "Deleted"], ["changed", "Changed"], ["notes", "Notes"], ["staff", "Staff"], ["restored", "Put back"]];
async function openHistory(kind) {
  location.hash = "history";
  HIST = { kind: kind || HIST.kind || "all", rows: [], more: false };
  $("#main").innerHTML = `<div class="loading">Loading history…</div>`;
  await loadHistory();
}
async function loadHistory(older) {
  const before = older && HIST.rows.length ? HIST.rows[HIST.rows.length - 1].id : null;
  const { data, error } = await db.rpc("list_history", { p_kind: HIST.kind, p_before_id: before, p_limit: 100 });
  if (error) { $("#main").innerHTML = `<div class="empty"><div><h2>Couldn't load history</h2>${esc(error.message)}${/function|schema/i.test(error.message) ? "<br>Run RUN SETUP.bat to turn on History." : ""}</div></div>`; return; }
  HIST.rows = older ? HIST.rows.concat(data) : data;
  HIST.more = data.length === 100;
  renderHistory();
}
function renderHistory(note) {
  const day = d => new Date(d).toLocaleDateString("en-CA", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  const time = d => new Date(d).toLocaleTimeString("en-CA", { hour: "numeric", minute: "2-digit" });
  let lastDay = "";
  $("#main").innerHTML = `<article class="staff history">
    <h1>History</h1>
    <p class="lead">Every change and deletion, newest first. Use <strong>Put back</strong> to undo one. Putting something back is recorded here too.</p>
    <div class="hist-filters" role="tablist" aria-label="Show">${HIST_KINDS.map(([k, t]) =>
      `<button class="chip" role="tab" aria-selected="${k === HIST.kind}" data-hist-kind="${k}">${t}</button>`).join("")}</div>
    <div class="staff-msg ${note?.err ? "err" : "ok"}" id="hist-msg" role="status">${note ? esc(note.text) : ""}</div>
    ${HIST.rows.length ? `<ol class="hist">${HIST.rows.map(r => {
      const d = day(r.changed_at), head = d !== lastDay ? `<li class="hist-day">${esc(d)}</li>` : ""; lastDay = d;
      return head + `<li class="hist-row ${r.action}" data-id="${r.id}">
        <span class="hist-time">${time(r.changed_at)}</span>
        <div class="hist-body">
          <div><span class="hist-kind">${esc(r.kind)}</span> <strong>${esc(r.who)}</strong> ${esc(r.summary.charAt(0).toLowerCase() + r.summary.slice(1))}
            ${r.customer_id ? `<button class="link" data-hist-open="${r.customer_id}">${esc(r.customer_name || "Open customer")}</button>` : ""}</div>
          ${r.detail ? `<div class="hist-detail">${esc(r.detail)}</div>` : ""}
          ${r.restored_by ? `<div class="hist-done">Put back by ${esc(r.restored_by)}, ${esc(day(r.restored_at))} at ${time(r.restored_at)}</div>` : ""}
        </div>
        <div class="hist-act">${r.can_restore ? `<button class="btn quiet-btn" type="button" data-hist-restore="${r.id}">Put back</button>` : ""}</div>
      </li>`; }).join("")}</ol>` : `<div class="quiet" style="padding:20px 0">Nothing here yet.</div>`}
    ${HIST.more ? `<button class="btn quiet-btn" type="button" id="hist-more">Show older</button>` : ""}
  </article>`;
  document.querySelectorAll("[data-hist-kind]").forEach(b => b.addEventListener("click", () => openHistory(b.dataset.histKind)));
  document.querySelectorAll("[data-hist-open]").forEach(b => b.addEventListener("click", () => openCustomer(Number(b.dataset.histOpen))));
  $("#hist-more")?.addEventListener("click", () => loadHistory(true));
  document.querySelectorAll("[data-hist-restore]").forEach(b => b.addEventListener("click", () => {
    const cell = b.parentElement;
    cell.innerHTML = `<span class="confirm">Put this back?</span><br><button class="link" type="button" data-yes>Yes</button> <button class="link" type="button" data-no>No</button>`;
    cell.querySelector("[data-no]").addEventListener("click", () => renderHistory());
    cell.querySelector("[data-yes]").addEventListener("click", async () => {
      const { data, error } = await db.rpc("restore_history", { p_audit_id: Number(b.dataset.histRestore) });
      if (error) { renderHistory({ err: true, text: "Not put back: " + error.message }); return; }
      await openHistory(HIST.kind);
      const m = $("#hist-msg"); if (m) { m.className = "staff-msg ok"; m.textContent = "Done. Put back " + data + "."; }
    });
  }));
}

/* ---------------- staff and permissions ---------------- */
const ROLES = [["owner", "Owner"], ["admin", "Admin"], ["office", "Office"], ["dispatcher", "Dispatcher"], ["accounting", "Accounting"],
               ["warehouse", "Warehouse"], ["technician", "Technician"], ["sales", "Sales"], ["read_only", "View only"]];
$("#staff-link").addEventListener("click", openStaff);

async function openStaff() {
  location.hash = "staff";
  document.querySelectorAll("#results .result").forEach(b => b.setAttribute("aria-current", "false"));
  $("#main").innerHTML = `<div class="loading">Loading staff…</div>`;
  const userQuery = (removedFilter) => { let q = db.from("app_users").select("id, login_email, role, active, employees(first_name, last_name), user_permissions!user_permissions_app_user_id_fkey(permission_code)");
    if (removedFilter) q = q.is("deleted_at", null);
    return q.order("active", { ascending: false }).order("login_email"); };
  let [users, perms] = await Promise.all([userQuery(true), db.from("permissions").select("*").order("sort_order")]);
  if (users.error) users = await userQuery(false);   // setup step 07 not run yet
  if (users.error || perms.error) { $("#main").innerHTML = `<div class="empty"><div><h2>Couldn't load staff</h2>${esc((users.error || perms.error).message)}</div></div>`; return; }

}

    tr.querySelector("[data-remove]")?.addEventListener("click", e => {
      const cell = e.target.parentElement;
      cell.innerHTML = `<span class="confirm">Remove?</span><br><button class="link danger" type="button" data-yes>Yes</button> <button class="link" type="button" data-no>No</button>`;
      cell.querySelector("[data-no]").addEventListener("click", () => openStaff());
      cell.querySelector("[data-yes]").addEventListener("click", async () => {
        const { data, error } = await db.rpc("request_staff_removal", { p_app_user_id: id });
        if (error) { await openStaff(); say("Not removed: " + error.message, true); }
        else if (data === "removed") reload(`Removed ${tr.dataset.email}. Their old notes keep their name. To block the login completely, also delete them in Supabase under Authentication, Users.`);
        else reload(`Asked to remove ${tr.dataset.email}. Nothing happens until the other owner approves it on their Staff page.`);
      });
    });
    tr.querySelector("[data-field=active]").addEventListener("change", saveMember);
    tr.querySelectorAll("[data-perm]").forEach(cb => cb.addEventListener("change", async () => {
      cb.disabled = true;
      const { error } = await db.rpc("set_user_permission", { p_app_user_id: id, p_code: cb.dataset.perm, p_granted: cb.checked });
      cb.disabled = false;
      if (error) { cb.checked = !cb.checked; say("Not saved: " + error.message, true); }
      else say(`${cb.checked ? "Granted" : "Removed"} ${perms.find(p => p.code === cb.dataset.perm).name.toLowerCase()} for ${tr.dataset.email}.`);
    }));
  });

  document.querySelectorAll("[data-approve]").forEach(b => b.addEventListener("click", async () => {
    b.disabled = true;
    const { data, error } = await db.rpc("approve_staff_removal", { p_request_id: Number(b.dataset.approve) });
    if (error) { await openStaff(); say("Not approved: " + error.message, true); return; }
    await reload(data === "removed" ? "Approved. The staff member has been removed." : "Approved. Still waiting for another owner.");
    checkIn();
  }));
  document.querySelectorAll("[data-reject]").forEach(b => b.addEventListener("click", async () => {
    b.disabled = true;
    const { data, error } = await db.rpc("cancel_staff_removal", { p_request_id: Number(b.dataset.reject) });
    if (error) { await openStaff(); say("Not changed: " + error.message, true); return; }
    await reload(data === "cancelled" ? "Request cancelled. Nobody was removed." : "Turned down. Nobody was removed.");
    checkIn();
  }));

  $("#add-staff").addEventListener("submit", async e => {
    e.preventDefault();
    const email = $("#st-email").value.trim();
    const { error } = await db.rpc("save_staff_member", { p_email: email, p_role: $("#st-role").value,
      p_first_name: $("#st-first").value.trim() || null, p_last_name: $("#st-last").value.trim() || null, p_active: true });
    if (error) { say("Not added: " + error.message, true); return; }
    reload(`Added ${email}. Now create their login in Supabase and tick their permissions.`);
  });
}

function equipmentHtml(list) {
  const today = new Date().toISOString().slice(0, 10);
  const items = list.map(e => {
    const cov = e.warranty_coverages || [];
    const partsEnd = cov.filter(w => w.covers_parts && w.status !== "void").map(w => w.end_date).sort().pop();
    const labourEnd = cov.filter(w => w.covers_labour && w.status !== "void").map(w => w.end_date).sort().pop();
    const start = e.install_date || cov.map(w => w.start_date).sort()[0];
    let bar = "";
    if (start && (partsEnd || labourEnd)) {
      const end = [partsEnd, labourEnd, today].filter(Boolean).sort().pop();
      const t0 = Date.parse(start), t1 = Date.parse(end), span = Math.max(t1 - t0, 1);
      const pct = d => Math.min(100, Math.max(0, (Date.parse(d) - t0) / span * 100));
      bar = `<div class="bar" aria-hidden="true"><div class="track"></div>
        ${partsEnd ? `<div class="parts" style="left:0;width:${pct(partsEnd)}%"></div>` : ""}
        ${labourEnd ? `<div class="labour" style="left:0;width:${pct(labourEnd)}%"></div>` : ""}
        <div class="today" style="left:calc(${pct(today)}% - 1px)" title="Today"></div>
        <div class="ends"><span>${monthYear(start)}</span><span>${monthYear(end)}</span></div></div>`;
    }
    const line = (label, d) => d ? (d >= today ? `<span class="ok">${label} until ${monthYear(d)}</span>` : `<span class="gone">${label} ended ${monthYear(d)}</span>`) : "";
    const coverText = [line("Parts", partsEnd), line("Labour", labourEnd)].filter(Boolean).join(", ")
      || `<span class="gone">No warranty on file</span>`;
    return `<div class="eq">
      <div><div class="what">${esc(e.equipment_types?.name || "Equipment")}${e.manufacturers?.name ? ", " + esc(e.manufacturers.name) : ""}</div>
        <div class="model">${esc([e.model_number && "Model " + e.model_number, e.serial_number && "Serial " + e.serial_number].filter(Boolean).join(", ") || "Model and serial not recorded")}</div>
        <div class="model">${e.install_date ? "Installed " + fmtDate(e.install_date) : "Install date unknown"}${e.installed_by_company ? " by us" : ""}${e.owner_type === "partner" ? ", rental" : ""}</div></div>
      <div>${bar}<div class="cover-text">${coverText}</div></div></div>`;
  });
  return `<div class="legend"><span><i style="background:var(--blue)"></i>Parts coverage</span><span><i style="background:var(--green)"></i>Labour coverage</span><span><i style="background:var(--ink);width:2px;height:12px"></i>Today</span></div>
    <div class="${list.length > 4 ? "scroll-box" : ""}" tabindex="${list.length > 4 ? 0 : -1}" aria-label="Equipment"><div class="equip">${items.join("")}</div></div>`;
}

function jobsHtml(jobs) {
  return `<div class="scroll-box" tabindex="0" aria-label="Job history"><table><thead><tr><th>Date</th><th>Job</th><th>What</th><th class="hide-sm">Unit</th><th>Status</th></tr></thead><tbody>
    ${jobs.map((j, i) => `<tr class="job-row" tabindex="0" data-job="${j.id}">
      <td class="num">${fmtDate(j.created_at)}</td><td class="num">${esc(j.job_number)}</td>
      <td>${esc(j.job_types?.name || "")}<div class="quiet">${esc((j.summary || "").slice(0, 120))}</div></td>
      <td class="hide-sm">${esc(j.business_units?.name || "")}${j.partners ? `<div class="quiet">${esc(j.partners.name)}</div>` : ""}</td>
      <td>${badge(j.status)}</td></tr>`).join("")}
    </tbody></table></div>${jobs.length > 8 ? `<div class="notes-foot">Scroll inside the box to see all ${jobs.length} jobs.</div>` : ""}`;
}

function toggleJob(row) {
  const next = row.nextElementSibling;
  if (next && next.classList.contains("job-detail")) { next.remove(); addBoxJumps(); return; }
  const j = current.jobs.find(x => x.id == row.dataset.job);
  const inv = current.invoices.filter(i => i.job_id === j.id);
  const visits = (j.visits || []).sort((a, b) => a.visit_number - b.visit_number).map(v => {
    const techs = (v.visit_assignments || []).map(a => `${a.employees?.first_name || ""} ${a.employees?.last_name || ""}`.trim() + (a.role !== "lead" ? ` (${a.role})` : "")).join(", ");
    return `<div class="visit">Visit ${v.visit_number}: ${fmtDate(v.scheduled_date)}, ${badge(v.status)} ${techs ? "with " + esc(techs) : '<span class="quiet">no tech recorded</span>'}</div>`;
  }).join("");
  const tr = document.createElement("tr");
  tr.className = "job-detail";
  tr.innerHTML = `<td colspan="5">
    ${j.description ? `<div style="white-space:pre-wrap;margin-bottom:8px">${esc(j.description)}</div>` : ""}
    ${visits || '<div class="quiet">No visits recorded.</div>'}
    ${inv.length ? `<div style="margin-top:6px">${inv.map(i => `Invoice ${esc(i.invoice_number)}: <span class="num">${money(i.total)}</span> ${badge(i.status)}`).join("<br>")}</div>` : ""}
    ${j.completed_at ? `<div class="quiet" style="margin-top:6px">Completed ${fmtDate(j.completed_at)}</div>` : ""}</td>`;
  row.after(tr);
  addBoxJumps();
  db.from("notes").select("body, pinned, created_at").eq("entity_type", "job").eq("entity_id", j.id)
    .order("created_at").then(({ data }) => {
      if (data && data.length && tr.isConnected)
        tr.firstElementChild.insertAdjacentHTML("beforeend",
          `<div style="margin-top:10px"><strong>Job notes</strong>${data.map(n => noteHtml(n)).join("")}</div>`);
    });
}

function invoicesHtml(list) {
  return `<div class="scroll-box" tabindex="0" aria-label="Invoices"><table><thead><tr><th>Date</th><th>Invoice</th><th class="r">Total</th><th class="r">Owing</th><th>Status</th></tr></thead><tbody>
    ${list.map((i, n) => `<tr><td class="num">${fmtDate(i.invoice_date)}</td><td class="num">${esc(i.invoice_number)}</td>
      <td class="r num">${money(i.total)}</td><td class="r num">${i.balance_due > 0.004 ? money(i.balance_due) : ""}</td><td>${badge(i.status)}</td></tr>`).join("")}
    </tbody></table></div>${list.length > 10 ? `<div class="notes-foot">Scroll inside the box to see all ${list.length} invoices.</div>` : ""}`;
}

function estimatesHtml(list) {
  return `<div class="scroll-box" tabindex="0" aria-label="Estimates"><table><thead><tr><th>Date</th><th>Estimate</th><th>Option</th><th class="r">Amount</th><th>Status</th></tr></thead><tbody>
    ${list.map((e, n) => { const o = (e.estimate_options || [])[0] || {}; const amt = (o.estimate_lines || []).reduce((s, l) => s + Number(l.line_total || 0), 0);
      return `<tr><td class="num">${fmtDate(e.created_at)}</td><td class="num">${esc(e.estimate_number)}</td>
      <td>${esc(o.name || "")}</td><td class="r num">${money(amt)}</td><td>${badge(e.status)}</td></tr>`; }).join("")}
    </tbody></table></div>${list.length > 10 ? `<div class="notes-foot">Scroll inside the box to see all ${list.length} estimates.</div>` : ""}`;
}

start();
</script>
