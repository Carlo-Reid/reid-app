# one-off, read-only: writes the database layout to a downloadable file (runs only from the tmp/schema-peek branch)
name: Schema peek
on:
  push:
    branches: [tmp/schema-peek]
permissions:
  contents: read
jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet "psycopg[binary]"
      - run: python sync/schema_peek.py
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: schema
          path: schema.txt
          retention-days: 2
