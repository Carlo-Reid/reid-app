# Every 10 minutes: look in the EFT mailbox (eftupload@hsginc.ca) for PAP lists (Excel). Only the customer #, name and phone
# columns are saved; the list waits on the Security page for an owner to approve. The mailbox is only read. The mailbox and database details come from this repository's secrets
# (Settings > Secrets and variables > Actions), never from the code, and the log never shows email details.
name: EFT mail

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}        # the "Run workflow" button on the Actions tab

concurrency:
  group: eft-mail
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet "psycopg[binary]" openpyxl xlrd
      - name: Check the EFT mailbox
        run: python sync/eft_mail.py
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          EFT_IMAP_USER: ${{ secrets.EFT_IMAP_USER }}
          EFT_IMAP_PASS: ${{ secrets.EFT_IMAP_PASS }}
          EFT_ALLOWED_SENDERS: ${{ secrets.EFT_ALLOWED_SENDERS }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
