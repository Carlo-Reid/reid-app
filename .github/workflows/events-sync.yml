# Every hour: the events on the techs' ServiceTitan schedules (non-job appointments), for Tech Calls and Payroll.
# Small and quick; the full sync still runs every night. ServiceTitan is only read.
name: ServiceTitan events (hourly)

on:
  schedule:
    - cron: "40 * * * *"      # every hour, at 40 minutes past
  workflow_dispatch: {}

concurrency:
  group: servicetitan-events
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "psycopg[binary]"
      - name: Events
        run: python sync/st_events.py
        env:
          ST_TENANT_ID: ${{ secrets.ST_TENANT_ID || secrets.TENANT_ID }}
          ST_APP_KEY: ${{ secrets.ST_APP_KEY || secrets.APP_KEY }}
          ST_CLIENT_ID: ${{ secrets.ST_CLIENT_ID || secrets.CLIENT_ID }}
          ST_CLIENT_SECRET: ${{ secrets.ST_CLIENT_SECRET || secrets.CLIENT_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
