# One-off: see which ServiceTitan inventory lists the app key can read (counts and field names only).
name: ServiceTitan inventory check
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "psycopg[binary]"
      - run: python sync/st_probe.py
        env:
          ST_TENANT_ID: ${{ secrets.ST_TENANT_ID || secrets.TENANT_ID }}
          ST_APP_KEY: ${{ secrets.ST_APP_KEY || secrets.APP_KEY }}
          ST_CLIENT_ID: ${{ secrets.ST_CLIENT_ID || secrets.CLIENT_ID }}
          ST_CLIENT_SECRET: ${{ secrets.ST_CLIENT_SECRET || secrets.CLIENT_SECRET }}
