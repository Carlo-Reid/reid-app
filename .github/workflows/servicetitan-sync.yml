# Every night: copy anything new or changed in ServiceTitan into the app's database.
# ServiceTitan is only read. The settings come from this repository's secrets
# (Settings > Secrets and variables > Actions), never from the code.
name: ServiceTitan nightly sync

on:
  schedule:
    - cron: "15 7 * * *"      # 7:15 UTC = 3:15 am in Ottawa (2:15 am in winter)
  workflow_dispatch: {}        # the "Run workflow" button on the Actions tab
  push:                        # and right away when a database change is added (sync/extra)
    branches: [main]
    paths: ["sync/extra/**"]

concurrency:
  group: servicetitan-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "psycopg[binary]"
      - name: Sync
        run: python sync/st_sync.py --source nightly
        env:
          ST_TENANT_ID: ${{ secrets.ST_TENANT_ID || secrets.TENANT_ID }}
          ST_APP_KEY: ${{ secrets.ST_APP_KEY || secrets.APP_KEY }}
          ST_CLIENT_ID: ${{ secrets.ST_CLIENT_ID || secrets.CLIENT_ID }}
          ST_CLIENT_SECRET: ${{ secrets.ST_CLIENT_SECRET || secrets.CLIENT_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
