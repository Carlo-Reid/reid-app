# Every 10 minutes: look in the supplier invoice mailbox (supplierpo@hsginc.ca) and save new invoice attachments
# into the app. The mailbox is only read. The mailbox and database details come from this repository's secrets
# (Settings > Secrets and variables > Actions), never from the code, and the log never shows email details.
name: Supplier mail

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}        # the "Run workflow" button on the Actions tab

concurrency:
  group: supplier-mail
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet "psycopg[binary]"
      - name: Check the mailbox
        run: python sync/supplier_mail.py
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
